[project]
name = "project-mapper"
version = "0.0.1"
description = "Project documentation mapper for LLM-assisted development"
requires-python = ">=3.9"
authors = [
    {name = "Project Maintainers"}
]
dependencies = [
    "pathlib"
]

[project.scripts]
project-mapper = "project_mapper.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta" 